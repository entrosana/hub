<?xml version="1.0" encoding="UTF-8"?>
<!-- entrosana logomark -- 8-point compass rose + inner diamond.
     Mark geometry matches the inline glyph rendered in the homepage SPA.
     Use on any background; the fill is the brand primary copper #B8895A. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     role="img" aria-label="entrosana logomark">
  <title>entrosana</title>
  <!-- Outer 8-point compass rose (cardinal + ordinal star) -->
  <path d="M32 4 L40 24 L60 32 L40 40 L32 60 L24 40 L4 32 L24 24 Z"
        fill="#B8895A"/>
  <!-- Inner diamond -- the deterministic core; same axis as the outer mark -->
  <path d="M32 20 L44 32 L32 44 L20 32 Z"
        fill="#1A1612"/>
  <!-- Centre stop -->
  <path d="M32 27 L37 32 L32 37 L27 32 Z"
        fill="#B8895A"/>
</svg>
